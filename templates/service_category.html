<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ category }} | RABBIT</title><style>*{box-sizing:border-box}body{margin:0;background:#020605;color:#f1fff7;font-family:Segoe UI,Tahoma,Arial,sans-serif}a{text-decoration:none;color:inherit}.wrap{width:min(1160px,92%);margin:auto;padding-bottom:80px}.top{min-height:78px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #103321}.brand{font:900 25px Consolas;color:#00f58a;letter-spacing:5px}.back{color:#9bb0a5}.hero{padding:70px 0 35px}.hero h1{font-size:clamp(34px,6vw,58px);margin:10px 0}.green{color:#00f58a}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{border:1px solid #12432c;background:#07110c;border-radius:14px;padding:24px;display:flex;flex-direction:column;min-height:260px}.card h2{font-size:21px}.card p{color:#91a69b;line-height:1.8;flex:1}.price{font-size:19px;font-weight:900;margin:12px 0}.btn{background:#00f58a;color:#00190c;text-align:center;padding:12px;border-radius:8px;font-weight:900}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header class="top"><a class="brand" href="{{ url_for('home') }}">RABBIT.</a><a class="back" href="{{ url_for('services') }}">رجوع إلى أقسام الخدمات</a></header><section class="hero"><div class="green">RABBIT / SERVICES</div><h1>{{ category }}</h1></section><main class="grid">{% for service in services %}<article class="card"><h2>{{ service.title }}</h2><p>{{ service.short_description }}</p><div class="price">{{ service.price }}</div><a class="btn" href="{{ url_for('service_detail', service_id=service.id) }}">التفاصيل والشراء</a></article>{% endfor %}</main></div></body></html>
