<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الدورة | RABBIT</title><style>body{background:#050906;color:#fff;font-family:Arial}.w{max-width:760px;margin:40px auto;padding:20px}.box{background:#08100b;border:1px solid #173221;border-radius:18px;padding:26px}label{display:block;margin:16px 0 7px;color:#a9b8ad}input,textarea{width:100%;padding:14px;background:#050906;color:#fff;border:1px solid #25422e;border-radius:10px}textarea{min-height:120px}.btn{margin-top:20px;background:#2ee57c;border:0;padding:14px 22px;border-radius:10px;font-weight:800;cursor:pointer}</style></head><body><div class="w"><a style="color:#9bb0a1" href="{{url_for('admin_courses')}}">← رجوع</a><div class="box"><h1>{% if course %}تعديل الدورة{% else %}إضافة دورة{% endif %}</h1><form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>اسم الدورة</label><input name="title" required value="{{course.title if course else ''}}"><label>التصنيف</label><input name="category" required value="{{course.category if course else ''}}"><label>المستوى</label><input name="level" required value="{{course.level if course else 'مبتدئ'}}"><label>السعر الظاهر</label><input name="price" value="{{course.price if course else '49,000 د.ع — اشتراك سنوي'}}"><label>السعر بالدينار للاشتراك — بالدفع الإلكتروني أو رصيد RABBIT</label><input type="number" min="1" name="price_iqd" value="{{course.price_iqd if course and course.price_iqd else (49000 if not course else '')}}" placeholder="مثال: 49000"><label>مدة الاشتراك بالأيام</label><input type="number" min="1" max="365" name="access_days" value="{{ course.access_days if course else 365 }}" required><p style="color:#9ab3a3;line-height:1.8">السعر السنوي الموحد 49,000 د.ع. بعد الحفظ تفتح صفحة استوديو الفيديو لرفع الملفات وقصّها.</p><label>المدرب</label><input name="instructor" value="{{course.instructor if course else ''}}"><label>الوصف</label><textarea name="description">{{course.description if course else ''}}</textarea><label><input style="width:auto" type="checkbox" name="is_published" {% if not course or course.is_published %}checked{% endif %}> منشورة للزوار</label><label><input style="width:auto" type="checkbox" name="is_demo" {% if course and course.is_demo %}checked{% endif %}> كورس تجريبي (لا يظهر زر الشراء)</label><p style="color:#97bea4;line-height:1.8">بعد الحفظ تفتح صفحة استوديو الفيديو لرفع الملفات وقصّها. لا يظهر الاشتراك للزبائن إلا بعد إضافة فيديو للدورة.</p><button class="btn">حفظ وفتح استوديو الفيديو</button></form></div></div></body></html>
