<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تعديل الخدمة | RABBIT</title><style>*{box-sizing:border-box}body{margin:0;background:#020605;color:#effff6;font-family:Segoe UI,Tahoma,Arial}.wrap{width:min(850px,92%);margin:auto;padding:35px 0 70px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #123c28;padding-bottom:20px}.brand{font:900 25px Consolas;color:#00f58a;letter-spacing:5px;text-decoration:none}.back{color:#9db3a7;text-decoration:none}.box{margin-top:35px;background:#06100b;border:1px solid #16462f;border-radius:16px;padding:28px}.field{margin:15px 0}label{display:block;margin-bottom:7px;font-weight:700}input,textarea{width:100%;background:#020605;border:1px solid #17462f;color:#fff;border-radius:9px;padding:13px;font:inherit}textarea{min-height:180px;resize:vertical}.btn{width:100%;background:#00f58a;color:#00170c;border:0;border-radius:9px;padding:14px;font-weight:900;cursor:pointer}</style></head><body><div class="wrap"><header class="top"><a class="brand" href="{{ url_for('admin_panel') }}">RABBIT.</a><a class="back" href="{{ url_for('admin_services') }}">رجوع لإدارة الخدمات</a></header><div class="box"><h1>تعديل الخدمة</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="field"><label>اسم الخدمة</label><input name="title" value="{{ service.title }}" required></div><div class="field"><label>القسم</label><input name="category" value="{{ service.category }}" required></div><div class="field"><label>وصف مختصر</label><input name="short_description" maxlength="280" value="{{ service.short_description or '' }}"></div><div class="field"><label>التفاصيل الكاملة وما تشمله الخدمة</label><textarea name="description">{{ service.description or '' }}</textarea></div><div class="field"><label>السعر</label><input name="price" value="{{ service.price }}" required placeholder="مثال: 300,000 د.ع"></div><div class="field"><label>الترتيب</label><input type="number" min="1" name="position" value="{{ service.position }}"></div><div class="field"><label><input style="width:auto" type="checkbox" name="is_active" {% if service.is_active %}checked{% endif %}> الخدمة ظاهرة للزبائن</label></div><button class="btn" type="submit">حفظ التعديلات</button></form></div></div></body></html>
