<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الدورة | RABBIT</title><style>body{background:#050906;color:#fff;font-family:Arial}.w{max-width:760px;margin:40px auto;padding:20px}.box{background:#08100b;border:1px solid #173221;border-radius:18px;padding:26px}label{display:block;margin:16px 0 7px;color:#a9b8ad}input,textarea{width:100%;padding:14px;background:#050906;color:#fff;border:1px solid #25422e;border-radius:10px}textarea{min-height:120px}.btn{margin-top:20px;background:#2ee57c;border:0;padding:14px 22px;border-radius:10px;font-weight:800;cursor:pointer}</style></head><body><div class="w"><a style="color:#9bb0a1" href="{{url_for('admin_courses')}}">← رجوع</a><div class="box"><h1>{% if course %}تعديل الدورة{% else %}إضافة دورة{% endif %}</h1><form method="post"><label>اسم الدورة</label><input name="title" required value="{{course.title if course else ''}}"><label>التصنيف</label><input name="category" required value="{{course.category if course else ''}}"><label>المستوى</label><input name="level" required value="{{course.level if course else 'مبتدئ'}}"><label>السعر</label><input name="price" value="{{course.price if course else 'قريباً'}}"><label>المدرب</label><input name="instructor" value="{{course.instructor if course else ''}}"><label>الوصف</label><textarea name="description">{{course.description if course else ''}}</textarea><label><input style="width:auto" type="checkbox" name="is_published" {% if not course or course.is_published %}checked{% endif %}> منشورة للزوار</label><button class="btn">حفظ</button></form></div></div></body></html>
