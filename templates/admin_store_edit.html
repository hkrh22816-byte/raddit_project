<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تعديل العرض | RABBIT</title><style>*{box-sizing:border-box}body{margin:0;background:#030605;color:#eafff3;font-family:Arial}.wrap{width:min(820px,92%);margin:40px auto}.box{background:#08100b;border:1px solid rgba(0,245,138,.18);border-radius:12px;padding:28px}a{color:#00f58a;text-decoration:none}.field{margin:14px 0}.field input,.field textarea,.field select{width:100%;padding:13px;background:#030605;border:1px solid #1c3327;color:#fff;border-radius:7px}.field textarea{min-height:140px}.btn{padding:12px 18px;background:#00f58a;color:#001b0d;border:0;border-radius:7px;font-weight:900;cursor:pointer}</style></head><body><div class="wrap"><p><a href="{{ url_for('admin_store') }}">رجوع لإدارة المتجر</a></p><div class="box"><h1>تعديل العرض</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="field"><label>اسم العرض</label><input name="title" required value="{{ item.title }}"></div><div class="field"><label>التصنيف</label><input name="category" value="{{ item.category }}"></div><div class="field"><label>وصف مختصر</label><input name="short_description" maxlength="280" value="{{ item.short_description }}"></div><div class="field"><label>التفاصيل</label><textarea name="description">{{ item.description }}</textarea></div><div class="field"><label>السعر الظاهر</label><input name="price" value="{{ item.price }}"></div><div class="field"><label>السعر بالدينار للدفع من رصيد Rabbit</label><input type="number" min="1" name="price_iqd" value="{{ item.price_iqd or '' }}"></div><div class="field"><label>حالة المخزون</label><select name="stock_status"><option value="available" {% if item.stock_status == 'available' %}selected{% endif %}>متوفر</option><option value="sold" {% if item.stock_status == 'sold' %}selected{% endif %}>غير متوفر</option></select></div><div class="field"><label>الترتيب</label><input type="number" min="1" name="position" value="{{ item.position }}"></div><label><input type="checkbox" name="is_active" {% if item.is_active %}checked{% endif %}> ظاهر بالمتجر</label><br><br><button class="btn">حفظ التعديلات</button></form></div></div></body></html>
