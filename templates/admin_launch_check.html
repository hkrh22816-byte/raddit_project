<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جاهزية الإطلاق | RABBIT</title><style>*{box-sizing:border-box}body{margin:0;background:#030605;color:#f2fff8;font-family:Arial}.w{width:min(900px,92%);margin:35px auto}a{color:#00f58a;text-decoration:none}.hero{padding:35px 0}.hero h1{font-size:44px;margin:10px 0}.muted{color:#8fa097}.check{display:flex;justify-content:space-between;gap:20px;align-items:center;background:#08100b;border:1px solid #173221;border-radius:12px;padding:20px;margin:12px 0}.ok{color:#00f58a;font-weight:900}.no{color:#ffbe55;font-weight:900}.btn{display:inline-block;margin-top:20px;padding:12px 16px;background:#00f58a;color:#00170c;border-radius:8px;font-weight:900}@media(max-width:600px){.check{align-items:flex-start;flex-direction:column}.hero h1{font-size:34px}}</style></head><body><div class="w"><a href="{{ url_for('admin_panel') }}">رجوع للوحة الإدارة</a><section class="hero"><div class="ok">LAUNCH CHECK</div><h1>جاهزية إطلاق RABBIT</h1><p class="muted">هاي الصفحة ما تمنع الإطلاق؛ بس تبينلك شنو جاهز وشنو بعد يحتاج محتوى أو إعداد.</p></section>{% for name,ready,detail in checks %}<div class="check"><div><strong>{{ name }}</strong><div class="muted" style="margin-top:7px">{{ detail }}</div></div><div class="{{ 'ok' if ready else 'no' }}">{{ 'جاهز' if ready else 'يحتاج إعداد' }}</div></div>{% endfor %}<a class="btn" href="{{ url_for('admin_panel') }}">لوحة الإدارة</a></div></body></html>
