<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">RABBIT logo</title>
  <desc id="desc">Neon green rounded square with a white R and rabbit ears</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#51ffd0"/>
      <stop offset=".45" stop-color="#00f58a"/>
      <stop offset="1" stop-color="#00b86b"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#0d2418"/>
      <stop offset=".72" stop-color="#06110b"/>
      <stop offset="1" stop-color="#020605"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="14" y="14" width="228" height="228" rx="45" fill="url(#bg)" stroke="url(#frame)" stroke-width="8" filter="url(#glow)"/>
  <ellipse cx="94" cy="68" rx="20" ry="48" transform="rotate(-22 94 68)" fill="#fff"/>
