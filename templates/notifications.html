<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الإشعارات | Rabbit</title><style>
*{box-sizing:border-box}body{margin:0;background:#030706;color:#effff5;font-family:"Segoe UI",Tahoma,Arial,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(900px,calc(100% - 28px));margin:36px auto 90px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.head h1{font-size:clamp(25px,5vw,36px);margin:0}.btn,.item{border:1px solid #244733;background:#0a130d;border-radius:13px}.btn{padding:10px 14px;color:#00f58a;font:inherit;cursor:pointer}.list{display:grid;gap:10px}.item{display:block;padding:16px}.item.unread{border-color:#00b873;background:#081910}.item h2{font-size:17px;margin:0 0 6px}.item p,.date,.empty{color:#9bac9f;line-height:1.7;margin:0}.date{font-size:12px;margin-top:9px}.empty{padding:28px;text-align:center;border:1px dashed #31513d;border-radius:14px}</style></head><body>
{% include '_site_header.html' %}<main class="wrap"><header class="head"><h1>الإشعارات</h1>{% if notifications %}<form method="post" action="{{ url_for('notifications_read_all') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn">تحديد الكل كمقروء</button></form>{% endif %}</header>
<section class="list">{% for item in notifications %}<a class="item {{ 'unread' if not item.is_read else '' }}" href="{{ url_for('notification_open',notification_id=item.id) }}"><h2>{% if not item.is_read %}● {% endif %}{{ item.title }}</h2><p>{{ item.body }}</p><div class="date">{{ item.created_at.strftime('%Y-%m-%d %H:%M') }}</div></a>{% else %}<div class="empty">ماكو إشعارات جديدة حالياً.</div>{% endfor %}</section></main></body></html>
