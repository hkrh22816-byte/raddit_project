<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ service.title }} | RABBIT</title><style>
*{box-sizing:border-box}body{margin:0;background:#030605;color:#eafff3;font-family:Arial,sans-serif;direction:rtl}a{text-decoration:none;color:inherit}.wrap{width:min(1180px,92%);margin:auto}.top{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(0,245,138,.12)}.brand{font-size:23px;font-weight:900;letter-spacing:6px;direction:ltr}.g{color:#00f58a}.nav{display:flex;gap:22px;color:#81958a;font-size:14px}.nav a:hover{color:#00f58a}.hero{padding:90px 0 55px}.eyebrow{color:#00f58a;font-family:Consolas,monospace;letter-spacing:2px;font-size:12px}.hero h1{font-size:clamp(38px,6vw,66px);margin:15px 0}.hero p{color:#81958a;line-height:2;max-width:720px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding-bottom:90px}.card{background:linear-gradient(145deg,#09110d,#050907);border:1px solid rgba(0,245,138,.13);border-radius:10px;padding:26px;min-height:235px;display:flex;flex-direction:column}.tag{color:#00f58a;font-size:12px}.card h2{font-size:21px;margin:18px 0 10px}.card p{color:#81958a;line-height:1.8;font-size:14px;flex:1}.price{font-weight:800;margin:14px 0}.btn{display:inline-block;padding:11px 16px;background:#00f58a;color:#001b0d;border-radius:5px;font-weight:800;border:0;cursor:pointer}.btn2{background:transparent;color:#d8e8df;border:1px solid #26372e}.box{max-width:780px;background:#08100b;border:1px solid rgba(0,245,138,.14);border-radius:10px;padding:30px;margin-bottom:80px}.field{margin:13px 0}.field input,.field textarea,.field select{width:100%;padding:13px;background:#030605;border:1px solid #1c3327;color:#fff;border-radius:5px}.field textarea{min-height:120px}.flash{padding:12px;margin:15px 0;border:1px solid #234332;border-radius:6px}.actions{display:flex;gap:10px;flex-wrap:wrap}.muted{color:#81958a}@media(max-width:800px){.grid{grid-template-columns:1fr}.nav{gap:10px;font-size:12px}.hero{padding-top:60px}}
</style></head><body><div class="wrap"><header class="top"><a class="brand" href="{{ url_for('home') }}">RABBIT<span class="g">.</span></a><nav class="nav"><a href="{{ url_for('services') }}">كل الخدمات</a><a href="{{ url_for('store') }}">المتجر</a><a href="{{ url_for('account') }}">حسابي</a></nav></header><section class="hero"><div class="eyebrow">{{ service.category }}</div><h1>{{ service.title }}</h1><p>{{ service.description }}</p><div class="price">{{ service.price }}</div></section><div class="box"><h2>اطلب الخدمة</h2>{% if current_user.is_authenticated %}<form method="post" action="{{ url_for('place_order') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="service_type" value="{{ service.title }}"><div class="field"><label>تفاصيل طلبك</label><textarea name="details" maxlength="2000" required placeholder="اشرح شنو تحتاج بالضبط"></textarea></div><div class="field"><label>رقم التواصل</label><input name="phone" maxlength="20" required placeholder="07xxxxxxxxx"></div><button class="btn" type="submit">إرسال الطلب</button></form>{% else %}<p class="muted">سجّل الدخول حتى ترسل طلب الخدمة وتتابعه من حسابك.</p><a class="btn" href="{{ url_for('auth_page') }}">تسجيل الدخول</a>{% endif %}</div></div></body></html>
