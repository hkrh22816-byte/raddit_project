<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تعديل الخدمة | RABBIT</title><style>*{box-sizing:border-box}body{margin:0;background:#020605;color:#effff6;font-family:Segoe UI,Tahoma,Arial}.wrap{width:min(850px,92%);margin:auto;padding:35px 0 70px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #123c28;padding-bottom:20px}.brand{font:900 25px Consolas;color:#00f58a;letter-spacing:5px;text-decoration:none}.back{color:#9db3a7;text-decoration:none}.box{margin-top:35px;background:#06100b;border:1px solid #16462f;border-radius:16px;padding:28px}.field{margin:15px 0}label{display:block;margin-bottom:7px;font-weight:700}input,textarea{width:100%;background:#020605;border:1px solid #17462f;color:#fff;border-radius:9px;padding:13px;font:inherit}textarea{min-height:180px;resize:vertical}.btn{width:100%;background:#00f58a;color:#00170c;border:0;border-radius:9px;padding:14px;font-weight:900;cursor:pointer}</style></head><body><div class="wrap"><header class="top"><a class="brand" href="{{ url_for('admin_panel') }}">RABBIT.</a><a class="back" href="{{ url_for('admin_services') }}">رجوع لإدارة الخدمات</a></header><div class="box"><h1>تعديل الخدمة</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="field"><label>اسم الخدمة</label><input name="title" value="{{ service.title }}" required></div><div class="field"><label>القسم</label><input name="category" value="{{ service.category }}" required></div><div class="field"><label>وصف مختصر</label><input name="short_description" maxlength="280" value="{{ service.short_description or '' }}"></div><div class="field"><label>التفاصيل الكاملة وما تشمله الخدمة</label><textarea name="description">{{ service.description or '' }}</textarea></div><div class="field"><label>السعر</label><input name="price" value="{{ service.price }}" required placeholder="مثال: 300,000 د.ع"></div><div class="field"><label>السعر بالدينار للدفع من الرصيد</label><input type="number" min="1" name="price_iqd" value="{{ service.price_iqd or '' }}" placeholder="مثال: 15000"></div><div class="field"><label>الترتيب</label><input type="number" min="1" name="position" value="{{ service.position }}"></div><div class="field"><label><input style="width:auto" type="checkbox" name="is_active" {% if service.is_active %}checked{% endif %}> الخدمة ظاهرة للزبائن</label></div><button class="btn" type="submit">حفظ التعديلات</button></form></div>
<div class="box"><h2>باقات العدد والسعر</h2><p style="color:#9db3a7">استخدمها للخدمات التي بيها أكثر من كمية وسعر.</p>
{% for p in service.packages %}<form method="post" action="{{ url_for('admin_service_package_edit', package_id=p.id) }}" style="border-bottom:1px solid #17462f;padding:15px 0"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="field"><label>اسم الباقة</label><input name="label" value="{{ p.label }}"></div><div class="field"><label>مميزات الباقة</label><textarea name="description">{{ p.description or '' }}</textarea></div><div class="field"><label>العدد (اكتب 1 إذا ما ينطبق)</label><input type="number" min="1" name="quantity" value="{{ p.quantity }}"></div><div class="field"><label>السعر بالدينار العراقي</label><input type="number" min="0" name="price_iqd" value="{{ p.price_iqd }}"></div><div class="field"><label>الترتيب</label><input type="number" min="1" name="position" value="{{ p.position }}"></div><label><input style="width:auto" type="checkbox" name="is_active" {% if p.is_active %}checked{% endif %}> مفعلة</label><button class="btn" style="margin-top:12px">حفظ الباقة</button></form>{% endfor %}
<h3>إضافة باقة جديدة</h3><form method="post" action="{{ url_for('admin_service_package_new', item_id=service.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="field"><label>اسم الباقة</label><input name="label" placeholder="مثال: باقة الانطلاقة"></div><div class="field"><label>مميزات الباقة</label><textarea name="description" placeholder="اكتب شنو تتضمن الباقة"></textarea></div><div class="field"><label>العدد (اكتب 1 إذا ما ينطبق)</label><input type="number" min="1" name="quantity" required></div><div class="field"><label>السعر بالدينار العراقي</label><input type="number" min="0" name="price_iqd" required></div><div class="field"><label>الترتيب</label><input type="number" min="1" name="position" value="1"></div><button class="btn">إضافة الباقة</button></form></div></div></body></html>
