<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تعديل الدرس | RABBIT</title><style>*{box-sizing:border-box}body{margin:0;background:#030605;color:#fff;font-family:Arial}.w{width:min(820px,92%);margin:35px auto}.box{background:#08100b;border:1px solid #173221;border-radius:16px;padding:25px}a{color:#00f58a;text-decoration:none}input{width:100%;padding:12px;margin:7px 0 14px;background:#030605;border:1px solid #25422e;border-radius:8px;color:#fff}.btn{background:#00f58a;color:#00170c;border:0;border-radius:8px;padding:12px 18px;font-weight:900;cursor:pointer}</style></head><body><div class="w"><p><a href="{{ url_for('admin_lessons', course_id=lesson.course_id) }}">رجوع للدروس</a></p><div class="box"><h1>تعديل الدرس</h1><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>عنوان الدرس</label><input name="title" required value="{{ lesson.title }}"><label>رابط الفيديو</label><input name="video_url" value="{{ lesson.video_url }}"><label>أو استبدل الفيديو بملف جديد</label><input type="file" name="video_file" accept="video/mp4,video/webm,video/quicktime"><label>المدة</label><input name="duration" value="{{ lesson.duration }}"><label>الترتيب</label><input type="number" min="1" name="position" value="{{ lesson.position }}"><label><input style="width:auto" type="checkbox" name="is_preview" {% if lesson.is_preview %}checked{% endif %}> هذا فيديو تجريبي مجاني يظهر قبل الاشتراك</label><br><br><button class="btn">حفظ التعديلات</button></form></div></div></body></html>
